[project]
name = "pixal3d-reference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3", "safetensors>=0.6.2", "pillow==12.0.0",
    "transformers==4.57.3", "timm==1.0.22", "einops", "easydict==1.13",
    "tqdm==4.67.1", "scipy", "opencv-python-headless==4.12.0.88",
    "trimesh==4.10.1", "xatlas", "ninja", "packaging", "psutil",
    "huggingface-hub<1", "plyfile==1.1.3", "zstandard==0.25.0",
]

[project.optional-dependencies]
cpu = ["torch==2.7.1", "torchvision==0.22.1"]
cuda = ["torch==2.7.1", "torchvision==0.22.1", "triton==3.3.1",
    "natten @ https://github.com/SHI-Labs/NATTEN/releases/download/v0.20.1/natten-0.20.1%2Btorch270cu128-cp312-cp312-linux_x86_64.whl"]
rocm = [
    "torch @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.2/torch-2.11.0+rocm7.2.2.lw.git4e323059-cp312-cp312-linux_x86_64.whl",
    "torchvision @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.2/torchvision-0.26.0+rocm7.2.2.git336d36e8-cp312-cp312-linux_x86_64.whl",
    "triton @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.2/triton-3.6.0+rocm7.2.2.git4ed88892-cp312-cp312-linux_x86_64.whl",
]

[tool.uv]
package = false
conflicts = [[{extra="cpu"}, {extra="cuda"}, {extra="rocm"}]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{index="pytorch-cpu", extra="cpu"}, {index="pytorch-cu128", extra="cuda"}]
torchvision = [{index="pytorch-cpu", extra="cpu"}, {index="pytorch-cu128", extra="cuda"}]
triton = [{index="pytorch-cu128", extra="cuda"}]
