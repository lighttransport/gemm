<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixal3D demo</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17202a;font:14px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:24px 16px}h1{margin:0 0 4px;font-size:25px}.sub{color:#66717e;margin-bottom:16px}.panel,.viewer{background:#fff;border:1px solid #d8dee7;border-radius:9px;padding:15px;margin-bottom:14px}label{display:block;font-weight:650;font-size:13px;margin:8px 0 4px}input,select,button{width:100%;padding:8px 10px;border:1px solid #bcc7d4;border-radius:6px;font:inherit;background:#fff}button{background:#216e5a;border:0;color:white;font-weight:700;cursor:pointer}button:disabled{background:#9ca8b5;cursor:wait}.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}.small{display:grid;grid-template-columns:1fr 1fr;gap:8px}#preview{display:block;max-width:260px;max-height:220px;margin-top:7px;border:1px solid #d8dee7;border-radius:6px;background:#edf0f4}.status{min-height:20px;margin-top:10px;color:#66717e}.models{display:grid;grid-template-columns:1fr 1fr;gap:12px}.models>b{display:block}.viewer model-viewer{display:block;width:100%;height:500px;background:#1b1e23;border-radius:7px}.stats{white-space:pre-wrap;color:#52606d;font:12px ui-monospace,monospace;margin-top:9px}.download{display:inline-block;margin-top:9px;color:#216e5a;margin-right:12px}.error{color:#a62d35;background:#fff0f1;padding:9px;border-radius:6px}.health{font:12px ui-monospace,monospace;color:#52606d;white-space:pre-wrap}@media(max-width:800px){.row{grid-template-columns:1fr}.models{grid-template-columns:1fr}.viewer model-viewer{height:420px}}
</style></head><body><main>
<h1>Pixal3D</h1><div class="sub">Single-image or posed multiview 3D reconstruction using the native Pixal3D pipeline. GPU inference can take several minutes.</div>
<form id="form" class="panel"><div class="row"><div><label>Input mode</label><select id="mode"><option value="single">Single image</option><option value="multi">Posed multiview</option></select><label>Input image(s)</label><input id="image" type="file" accept="image/*" required><img id="preview" alt="preview"><div id="multi-fields" hidden><label>transforms.json</label><input id="transforms" type="file" accept="application/json,.json"><small>Choose all RGBA frames listed in transforms.json.</small></div><div id="mask-field"><label>Optional mask</label><input id="mask" type="file" accept="image/*"></div></div>
<div><label>Backend</label><select id="backend"><option value="cuda">CUDA</option><option value="rocm">ROCm</option><option value="cpu">CPU</option></select><label>GPU execution</label><select id="execution"><option value="legacy">Legacy</option><option value="resident">Resident</option></select><label>GPU kernels</label><select id="kernels"><option value="auto">Automatic</option><option value="blas">Vendor BLAS</option><option value="mma">Explicit MMA / WMMA</option></select><label>Flow precision</label><select id="precision"><option value="mixed">Mixed BF16/FP32 (recommended)</option><option value="bf16">BF16</option><option value="fp32">FP32</option></select><label>Device (optional)</label><input id="device" placeholder="0"><label>Threads (CPU)</label><input id="threads" type="number" min="0" value="0"></div>
<div><div class="small"><div><label>FOV (rad)</label><input id="fov" type="number" step="0.001" value="0.857556"></div><div><label>Seed</label><input id="seed" type="number" value="42"></div><div><label>Distance</label><input id="distance" type="number" step="0.01" value="0"></div><div><label>Mesh scale</label><input id="scale" type="number" step="0.01" value="1"></div></div><label>VRAM budget (MiB)</label><input id="vram" type="number" min="513" max="14336" value="12288"><button id="run" type="submit" style="margin-top:14px">Generate GLB</button><div id="status" class="status"></div></div></div></form>
<div class="panel"><b>Server health</b><div id="health" class="health">checking…</div></div><div class="panel"><label><input id="reference" type="checkbox" style="width:auto"> Run pinned PyTorch reference (CUDA/ROCm, slower)</label><label>Comparison view</label><select id="view"><option value="native">Native result</option><option value="side">Side by side</option><option value="overlay">Overlay</option></select><label id="opacity-label" hidden>Reference opacity <input id="opacity" type="range" min="0" max="1" step="0.01" value="0.5"></label></div><section class="viewer"><div id="models" class="models"><div><b>Native Pixal3D</b><model-viewer id="model" camera-controls auto-rotate shadow-intensity="1" interaction-prompt="none"></model-viewer></div><div id="reference-pane" hidden><b>PyTorch reference</b><model-viewer id="reference-model" camera-controls auto-rotate shadow-intensity="1" interaction-prompt="none"></model-viewer></div></div><div id="stats" class="stats"></div><a id="download" class="download" hidden download="pixal3d.glb">Download native GLB</a><a id="reference-download" class="download" hidden download="pixal3d-reference.glb">Download reference GLB</a></section>
</main><script>
const $=id=>document.getElementById(id); let objectUrl,referenceUrl;
function fileB64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
async function health(){try{const r=await fetch('/health');const j=await r.json();$('execution').value=j.default_gpu_execution||'legacy';$('kernels').value=j.default_gpu_kernels||'auto';$('precision').value=j.default_gpu_flow_precision||'mixed';$('health').textContent=JSON.stringify(j.backends,null,2)}catch(e){$('health').textContent='unavailable: '+e}}
function preview(){const f=$('image').files[0];if(f)$('preview').src=URL.createObjectURL(f)} $('image').addEventListener('change',preview);$('mode').addEventListener('change',()=>{const multi=$('mode').value==='multi';$('image').multiple=multi;$('multi-fields').hidden=!multi;$('mask-field').hidden=multi;if(!multi&&$('image').files.length>1)$('image').value=''}); health();
function applyView(){const hasRef=Boolean(referenceUrl),view=$('view').value;$('reference-pane').hidden=!hasRef||view==='native';$('opacity-label').hidden=!hasRef||view!=='overlay';if(hasRef&&view==='overlay'){$('models').style.gridTemplateColumns='1fr';$('reference-pane').hidden=false;$('reference-pane').style.marginTop='-527px';$('reference-model').style.opacity=$('opacity').value}else{$('models').style.gridTemplateColumns='1fr 1fr';$('reference-pane').style.marginTop='';$('reference-model').style.opacity='1'}}$('view').addEventListener('change',applyView);$('opacity').addEventListener('input',applyView);
$('form').addEventListener('submit',async e=>{e.preventDefault();const image=$('image').files[0];if(!image)return;$('run').disabled=true;$('status').textContent=$('reference').checked?'running native + PyTorch reference…':'running…';$('stats').textContent='';$('download').hidden=true;$('reference-download').hidden=true;try{const multi=$('mode').value==='multi';if(multi&&$('reference').checked)throw new Error('PyTorch comparison is currently single-view only');const body={backend:$('backend').value,gpu_execution:$('execution').value,gpu_kernels:$('kernels').value,gpu_flow_precision:$('precision').value,fov:Number($('fov').value),distance:Number($('distance').value),mesh_scale:Number($('scale').value),seed:Number($('seed').value),threads:Number($('threads').value),reference:$('reference').checked};if(multi){const tf=$('transforms').files[0];if(!tf)throw new Error('Choose transforms.json');const meta=JSON.parse(await tf.text()),files=new Map([...$('image').files].map(f=>[f.name,f]));if(!Array.isArray(meta.frames)||!meta.frames.length)throw new Error('transforms.json has no frames');body.mesh_scale=Number(meta.mesh_scale??1);body.fov=Number(meta.camera_angle_x??body.fov);body.views=[];for(const frame of meta.frames){const name=String(frame.file_path||'').split('/').pop(),file=files.get(name);if(!file)throw new Error('Missing view image: '+name);body.views.push({image_b64:await fileB64(file),transform_matrix:frame.transform_matrix,fov:frame.camera_angle_x})}}else{body.image_b64=await fileB64(image);body.image_ext='.'+(image.name.split('.').pop()||'png').toLowerCase();const mask=$('mask').files[0];if(mask)body.mask_b64=await fileB64(mask)}if($('device').value)body.device=$('device').value;if($('vram').value)body.vram_budget_mib=Number($('vram').value);const r=await fetch('/v1/infer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'inference failed');const bytes=Uint8Array.from(atob(j.glb_b64),c=>c.charCodeAt(0));if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(new Blob([bytes],{type:'model/gltf-binary'}));$('model').src=objectUrl;$('download').href=objectUrl;$('download').hidden=false;if(j.reference){const rb=Uint8Array.from(atob(j.reference.glb_b64),c=>c.charCodeAt(0));if(referenceUrl)URL.revokeObjectURL(referenceUrl);referenceUrl=URL.createObjectURL(new Blob([rb],{type:'model/gltf-binary'}));$('reference-model').src=referenceUrl;$('reference-download').href=referenceUrl;$('reference-download').hidden=false}applyView();$('stats').textContent=JSON.stringify({mode:multi?'multiview':'single',precision:$('precision').value,stats:j.stats,profile:j.profile},null,2)+'\nElapsed: '+j.elapsed_ms+' ms'+(j.reference?'\nPyTorch reference: '+j.reference.elapsed_ms+' ms':'');$('status').textContent='complete'}catch(err){$('status').innerHTML='<span class="error">'+String(err)+'</span>'}finally{$('run').disabled=false}});
</script></body></html>
